<svg width="1360" height="2120" viewBox="0 0 680 1060" xmlns="http://www.w3.org/2000/svg">
<title>PAX L920-BE Custom RS232 Cable - Complete Wiring Guide</title>
<desc>Foolproof wiring diagram: RJ45 pin 5 (White/Blue) to DB9 pin 3 (TXD), RJ45 pin 6 (Green) to DB9 pin 4 (DTR), RJ45 pin 7 (White/Brown) to DB9 pin 1 (DCD). Only 3 of 8 wires used. Prolific PL2303 chipset required, FTDI does not work.</desc>
