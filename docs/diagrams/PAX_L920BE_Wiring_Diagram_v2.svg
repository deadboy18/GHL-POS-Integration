<text class="th" x="340" y="535" text-anchor="middle" fill="#2C2C2A">Summary: which wire goes where</text>

<rect class="box-blue" x="40" y="553" width="190" height="52" rx="8"/>
<text class="th" x="135" y="573" text-anchor="middle" dominant-baseline="central" fill="#0C447C">White/Blue wire</text>
<text class="ts" x="135" y="593" text-anchor="middle" dominant-baseline="central" fill="#185FA5">RJ45 pin 5 to DB9 pin 3</text>

<rect class="box-green" x="245" y="553" width="190" height="52" rx="8"/>
<text class="th" x="340" y="573" text-anchor="middle" dominant-baseline="central" fill="#27500A">Green wire</text>
<text class="ts" x="340" y="593" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">RJ45 pin 6 to DB9 pin 4</text>

<rect class="box-coral" x="450" y="553" width="190" height="52" rx="8"/>
<text class="th" x="545" y="573" text-anchor="middle" dominant-baseline="central" fill="#712B13">White/Brown wire</text>
<text class="ts" x="545" y="593" text-anchor="middle" dominant-baseline="central" fill="#993C1D">RJ45 pin 7 to DB9 pin 1</text>

<line x1="40" y1="625" x2="640" y2="625" stroke="#D3D1C7" stroke-width="0.5"/>

<text class="th" x="340" y="655" text-anchor="middle" fill="#2C2C2A">How to build this cable</text>

<rect class="box-gray" x="40" y="672" width="290" height="96" rx="10"/>
<text class="th" x="56" y="696" dominant-baseline="central" fill="#444441">Step 1: Strip the cable</text>
<text class="ts" x="56" y="718" fill="#5F5E5A">Cut a Cat5e or Cat6 network cable.</text>
<text class="ts" x="56" y="734" fill="#5F5E5A">Strip outer jacket to expose 8 wires.</text>
<text class="ts" x="56" y="750" fill="#5F5E5A">You only need 3 of the 8 wires.</text>

<rect class="box-gray" x="350" y="672" width="290" height="96" rx="10"/>
<text class="th" x="366" y="696" dominant-baseline="central" fill="#444441">Step 2: Crimp the RJ45 end</text>
<text class="ts" x="366" y="718" fill="#5F5E5A">Crimp one end using standard T568B</text>
<text class="ts" x="366" y="734" fill="#5F5E5A">order into an RJ45 plug. All 8 wires</text>
<text class="ts" x="366" y="750" fill="#5F5E5A">go into the plug as normal.</text>

<rect class="box-gray" x="40" y="780" width="290" height="96" rx="10"/>
<text class="th" x="56" y="804" dominant-baseline="central" fill="#444441">Step 3: Solder the DB9 end</text>
<text class="ts" x="56" y="826" fill="#5F5E5A">On the other end, solder only:</text>
<text class="ts" x="56" y="842" fill="#5F5E5A">White/Blue to pin 3, Green to pin 4,</text>
<text class="ts" x="56" y="858" fill="#5F5E5A">White/Brown to pin 1. Leave rest empty.</text>

<rect class="box-gray" x="350" y="780" width="290" height="96" rx="10"/>
<text class="th" x="366" y="804" dominant-baseline="central" fill="#444441">Step 4: Configure serial port</text>
<text class="ts" x="366" y="826" fill="#5F5E5A">In Device Manager, set COM port to:</text>
<text class="ts" x="366" y="842" fill="#5F5E5A">9600 baud, 8 data bits, no parity,</text>
<text class="ts" x="366" y="858" fill="#5F5E5A">1 stop bit, no flow control.</text>

<line x1="40" y1="896" x2="640" y2="896" stroke="#D3D1C7" stroke-width="0.5"/>

<rect class="box-teal" x="40" y="912" width="290" height="56" rx="8"/>
<text class="th" x="185" y="932" text-anchor="middle" dominant-baseline="central" fill="#085041">USB adapter: Prolific PL2303</text>
<text class="ts" x="185" y="952" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Must be Prolific chipset</text>

<rect class="box-red" x="350" y="912" width="290" height="56" rx="8"/>
<text class="th" x="495" y="932" text-anchor="middle" dominant-baseline="central" fill="#791F1F">FTDI will NOT work</text>
<text class="ts" x="495" y="952" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">Tested and confirmed incompatible</text>

<rect class="box-gray" x="40" y="984" width="600" height="56" rx="8"/>
<text class="th" x="340" y="1004" text-anchor="middle" dominant-baseline="central" fill="#444441">Full chain: PC (USB) -- PL2303 adapter -- DB9 -- custom cable -- RJ45 -- L920 base -- A920 terminal</text>
<text class="ts" x="340" y="1024" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">The L920 base connects to A920 via Bluetooth or WiFi (WiFi must have a password set)</text>

</svg>