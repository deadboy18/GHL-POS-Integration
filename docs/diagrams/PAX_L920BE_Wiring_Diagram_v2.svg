<circle cx="600" cy="370" r="10" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="600" y="370" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">5</text>

<circle cx="498" cy="440" r="10" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="498" y="440" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">6</text>
<circle cx="533" cy="440" r="10" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="533" y="440" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">7</text>
